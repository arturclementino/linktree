kind = "web"
previewPath = "/"
title = "Artur Clementino — Linktree"
version = "1.0.0"
id = "artifacts/linktree"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25140

[services.development]
run = "pnpm --filter @workspace/linktree run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/linktree", "run", "build" ]
serve = "static"
publicDir = "artifacts/linktree/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25140"
BASE_PATH = "/"
